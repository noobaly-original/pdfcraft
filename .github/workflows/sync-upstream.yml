name: Upstream Sync & Rebase

on:
  schedule:
    # Run every morning at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Enable manual run from GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync with upstream/main
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork repository
        uses: actions/checkout@v4
        with:
          ref: turkish-supported
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/storytold/pdfcraft.git || true
          git fetch upstream main

      - name: Merge upstream/main into turkish-supported
        id: merge
        run: |
          echo "Attempting to merge upstream/main..."
          if git merge upstream/main -m "chore(sync): auto-merge upstream/main into turkish-supported"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            git push origin turkish-supported
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "Conflict detected during merge. Automated resolution skipped."
            exit 1
          fi

      - name: Notify on conflict failure
        if: failure() && steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Upstream Sync Conflict Detected",
              body: "Automatic sync with `upstream/main` encountered merge conflicts on branch `turkish-supported`.\n\nPlease resolve conflicts locally:\n```bash\ngit fetch upstream\ngit checkout turkish-supported\ngit merge upstream/main\n# Resolve conflicts and preserve Turkish font metrics & encoding\ngit commit\ngit push origin turkish-supported\n```"
            });
